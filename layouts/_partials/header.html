{{- $current := . }}
<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>
      {{ partial "logo.html" }}
      <span class="brand__name">{{ site.Title }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="nav-toggle__label" aria-hidden="true">{{ T "menu" }}</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="visually-hidden">{{ T "menu" }}</span>
    </button>
    <nav class="nav" id="site-nav" aria-label="{{ T "main_navigation" }}" data-nav>
      <ul class="nav__list">
        {{- range $i, $m := site.Menus.main }}
        {{- $active := or ($current.IsMenuCurrent "main" $m) ($current.HasMenuCurrent "main" $m) }}
        <li><a class="nav__link{{ if and $active (not ($current.IsMenuCurrent "main" $m)) }} is-ancestor{{ end }}" href="{{ $m.URL }}" {{ if $current.IsMenuCurrent "main" $m }}aria-current="page"{{ end }}><span class="nav__ch" aria-hidden="true">{{ printf "%02d" (add $i 1) }}</span>{{ $m.Name }}</a></li>
        {{- end }}
      </ul>
      {{ partial "lang-switch.html" . }}
    </nav>
  </div>
</header>
