{{- $css := resources.Get "css/main.css" | resources.Minify }}
<link rel="preload" href="{{ "fonts/big-shoulders-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{- if .IsHome }}
<link rel="preload" href="{{ "fonts/big-shoulders-stencil-latin.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{- end }}
{{- /* Inlined: the stylesheet is small and this removes the only render-blocking request */}}
<style>{{ replace $css.Content "../fonts/" (relURL "fonts/") | safeCSS }}</style>
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<meta name="theme-color" content="#09090a">
<meta name="color-scheme" content="dark">
{{- with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">
{{- end }}
